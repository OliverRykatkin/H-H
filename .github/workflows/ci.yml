name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check mandatorn_model tests tools
      - name: Tester (modell, publicering, kvalitetsgrind)
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Genererade kontrakt är aktuella
        run: python tools/gen_contracts.py --check
      - name: TypeScript-typerna kompilerar
        run: npx --yes -p typescript@5 tsc --noEmit --strict contracts/ts/contracts.ts

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
