name: Synka mätningar från SwedishPolls

# Jämför den committade kopian (data/polls/Polls.csv) med SwedishPolls och committar direkt
# till main vid förändring och startar publiceringen. (DECISIONS D16)
on:
  schedule:
    - cron: "43 */3 * * *"   # var tredje timme, på udda minut
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hämta SwedishPolls
        run: |
          curl -fsSL -m 60 --retry 3 \
            https://raw.githubusercontent.com/MansMeg/SwedishPolls/master/Data/Polls.csv \
            -o data/polls/Polls.csv
      - name: Sammanfatta ändringen
        id: diff
        run: |
          if git diff --quiet -- data/polls/Polls.csv; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            {
              echo 'summary<<EOF'
              git diff --unified=0 -- data/polls/Polls.csv | grep '^+[^+]' | cut -c2- | cut -d, -f2,13,14 | head -30
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Committa till main och starta publicering
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/polls/Polls.csv
          git commit -m "Nya mätningar från SwedishPolls" -m "${{ steps.diff.outputs.summary }}"
          git push origin HEAD:main
          # Push med GITHUB_TOKEN triggar inte publish.yml — starta den uttryckligen.
          gh workflow run publish.yml --ref main
