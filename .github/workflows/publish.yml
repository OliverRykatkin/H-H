name: Publicera

# Utlösare: ny mätning (merge till data/polls/), modelländring, daglig körning, manuellt.
# Schemat ligger på udda minut — GitHubs schemalagda körningar försenas ofta på hel timme.
on:
  push:
    branches: [main]
    paths:
      - "data/polls/**"
      - "mandatorn_model/**"
      - "data/*.json"
  schedule:
    - cron: "17 4 * * *"   # 06:17 svensk sommartid / 05:17 vintertid
  workflow_dispatch:
    inputs:
      reference_date:
        description: "Referensdatum YYYY-MM-DD (tomt = i dag)"
        required: false
      supersedes:
        description: "Release-id som rättas (sätter supersededBy)"
        required: false
      force:
        description: "Publicera trots flaggor i kvalitetsgrinden"
        type: boolean
        default: false

permissions:
  id-token: write   # OIDC mot AWS
  contents: read
  issues: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      DATA_BUCKET: ${{ vars.DATA_BUCKET }}
      DATA_DISTRIBUTION_ID: ${{ vars.DATA_DISTRIBUTION_ID }}
      MODEL_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-pipeline.txt
      - run: pip install -r requirements-pipeline.txt

      - name: AWS-inloggning (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-north-1

      - name: Kvalitetsgrind, modell och publicering
        id: publish
        run: |
          out=dist-data
          extra=()
          if [ -n "$AWS_ROLE_ARN" ]; then
            out="s3://$DATA_BUCKET"
            extra+=(--distribution-id "$DATA_DISTRIBUTION_ID")
          fi
          [ -n "${{ inputs.reference_date }}" ] && extra+=(--reference-date "${{ inputs.reference_date }}")
          [ -n "${{ inputs.supersedes }}" ] && extra+=(--supersedes "${{ inputs.supersedes }}")
          [ "${{ inputs.force }}" = "true" ] && extra+=(--force)
          set +e
          python -m mandatorn_model.publish --out "$out" --report report.md "${extra[@]}" | tee publish.log
          code=${PIPESTATUS[0]}
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" != "0" ] && [ "$code" != "2" ]; then exit "$code"; fi

      - name: Flaggad körning → issue (inget publiceras)
        if: steps.publish.outputs.code == '2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Kvalitetsgrinden stoppade publiceringen $(date -u +%F)"
          if ! gh issue list --state open --search "in:title \"Kvalitetsgrinden stoppade\"" --json number -q '.[0].number' | grep -q .; then
            gh issue create --title "$title" --body-file report.md
          fi
          exit 1

      - name: Spara releasen som artefakt (ingen AWS konfigurerad än)
        if: env.AWS_ROLE_ARN == '' && steps.publish.outputs.code == '0'
        uses: actions/upload-artifact@v4
        with:
          name: dist-data
          path: dist-data
          retention-days: 7

      - name: Heartbeat-ping
        if: steps.publish.outputs.code == '0' && vars.HEALTHCHECK_URL != ''
        run: curl -fsS -m 10 --retry 3 "${{ vars.HEALTHCHECK_URL }}"

      - name: Lokal kopia av releasen för sajtbygget
        if: steps.publish.outputs.code == '0' && env.AWS_ROLE_ARN != ''
        run: python -m mandatorn_model.publish --out dist-data --force ${{ inputs.reference_date && format('--reference-date {0}', inputs.reference_date) || '' }}

      - uses: actions/setup-node@v4
        if: steps.publish.outputs.code == '0'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Bygg sajten
        if: steps.publish.outputs.code == '0'
        working-directory: web
        env:
          PUBLIC_DATA_URL: ${{ vars.PUBLIC_DATA_URL }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          PUBLIC_PLAUSIBLE_DOMAIN: ${{ vars.PUBLIC_PLAUSIBLE_DOMAIN }}
          PUBLIC_BUILD_COMMIT: ${{ github.sha }}
        run: npm ci && npm run build

      - name: Ladda upp sajten och invalidera HTML
        if: steps.publish.outputs.code == '0' && env.AWS_ROLE_ARN != '' && vars.SITE_BUCKET != ''
        working-directory: web
        run: |
          aws s3 sync dist/_astro "s3://${{ vars.SITE_BUCKET }}/_astro" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync dist "s3://${{ vars.SITE_BUCKET }}" --exclude "_astro/*" --exclude "_data/*"             --cache-control "public, max-age=0, s-maxage=300" --delete
          aws cloudfront create-invalidation --distribution-id "${{ vars.SITE_DISTRIBUTION_ID }}" --paths "/*"

      - name: Spara sajten som artefakt (ingen AWS konfigurerad än)
        if: steps.publish.outputs.code == '0' && env.AWS_ROLE_ARN == ''
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: web/dist
          retention-days: 7
